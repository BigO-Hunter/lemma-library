name = "LemmaLibrary"
version = "0.1.0"
defaultTargets = ["LemmaLibrary"]

# A standalone, port-able library of the reusable lemmas extracted from the
# kapila-row / jv1000 formalisation campaign.  The pin is the campaign pin
# (Lean v4.34.1, Mathlib d13f23b) so a proof built here needs no port.
#
# Build reuse: `.lake/packages` is a symlink to the campaign lane's already-built
# Mathlib tree, so this package compiles only its own modules.  The symlink is a
# development convenience, NOT part of the library: a fresh clone runs
# `lake exe cache get` and builds the same bytes.

[[require]]
name = "Mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "LemmaLibrary"
srcDir = "src"
globs = ["LemmaLibrary", "LemmaLibrary.+"]
